<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5G 基站智能运维平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;}
.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;font-size:16px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:10px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:flex;height:calc(100vh - 52px);}
.left{flex:1;min-width:0;display:flex;flex-direction:column;}
.right{width:420px;flex-shrink:0;background:#fff;border-left:1px solid #e5e7eb;overflow-y:auto;}
.toolbar{padding:16px 20px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap;}
.toolbar input,.toolbar select{border:1px solid #d1d5db;border-radius:6px;padding:8px 12px;font-size:13px;outline:none;}
.toolbar input{flex:1;min-width:200px;}
.stats{padding:14px 20px;display:flex;gap:14px;}
.stat{flex:1;background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;}
.stat .num{font-size:26px;font-weight:700;}
.stat .lbl{font-size:12px;color:#6b7280;}
.table-wrap{flex:1;overflow-y:auto;padding:0 20px 20px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);}
th,td{text-align:left;padding:10px 14px;font-size:13px;}
th{background:#f8fafc;color:#6b7280;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e5e7eb;}
td{border-bottom:1px solid #f3f4f6;}
tr:hover td{background:#f8fafc;cursor:pointer;}
tr.active td{background:#eff6ff;}
.status{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;}
.status-running{background:#ecfdf5;color:#059669;}
.status-alarm{background:#fef2f2;color:#dc2626;}
.status-maintenance{background:#fffbeb;color:#d97706;}
.detail-empty{padding:60px 20px;text-align:center;color:#9ca3af;}
.detail-content{padding:20px;display:none;}
.detail-content h3{font-size:16px;margin-bottom:16px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px;}
.info-item{display:flex;flex-direction:column;}
.info-item .label{font-size:10px;color:#9ca3af;text-transform:uppercase;}
.info-item .value{font-size:13px;font-weight:600;}
.alarm-box{padding:12px;border-radius:6px;margin-bottom:10px;font-size:12px;}
.alarm-box.has-alarms{background:#fef2f2;border:1px solid #fecaca;}
.alarm-box.no-alarms{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;}
.alarm-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #fee2e2;font-size:12px;}
.alarm-row:last-child{border-bottom:none;}

/* Agent 按钮区 */
.agent-bar{padding:16px 20px;border-top:1px solid #e5e7eb;display:flex;flex-direction:column;gap:8px;}
.agent-bar h4{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.agent-btn{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;color:#fff;text-align:left;width:100%;}
.agent-btn .exp-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.25);}
.btn-single{background:#2563eb;}
.btn-multi{background:#7c3aed;}
.btn-hitl{background:#d97706;}
.btn-rag{background:#059669;}
.agent-btn:disabled{opacity:.5;cursor:not-allowed;}

/* 输出区 */
.output-box{padding:0 20px 20px;}
.output-box h4{font-size:12px;color:#6b7280;margin-bottom:8px;text-transform:uppercase;}
.output-area{background:#f3f4f6;border-radius:8px;padding:12px;min-height:60px;max-height:240px;overflow-y:auto;font-size:12px;white-space:pre-wrap;}
.loading{color:#2563eb;animation:pulse 1.5s infinite;}
</style>
</head>
<body>

<div class="header"><span class="dot"></span>5G 基站智能运维平台</div>

<div class="layout">
  <!-- ====== 左侧：设备列表 ====== -->
  <div class="left">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索设备 ID / 型号…" oninput="renderTable()">
      <select id="filterStatus" onchange="renderTable()">
        <option value="">全部状态</option><option value="running">🟢 运行中</option><option value="alarm">🔴 告警中</option><option value="maintenance">🟡 维护中</option>
      </select>
      <select id="filterVendor" onchange="renderTable()">
        <option value="">全部厂商</option><option value="华为">华为</option><option value="中兴">中兴</option><option value="爱立信">爱立信</option><option value="诺基亚">诺基亚</option>
      </select>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">-</div><div class="lbl">设备总数</div></div>
      <div class="stat"><div class="num" id="statRunning" style="color:#059669">-</div><div class="lbl">运行中</div></div>
      <div class="stat"><div class="num" id="statAlarm" style="color:#dc2626">-</div><div class="lbl">告警中</div></div>
      <div class="stat"><div class="num" id="statMaintenance" style="color:#d97706">-</div><div class="lbl">维护中</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>设备 ID</th><th>型号</th><th>厂商</th><th>站点</th><th>状态</th><th>告警数</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ====== 右侧：详情 + Agent ====== -->
  <div class="right">
    <div class="detail-empty" id="detailEmpty"><div style="font-size:48px;margin-bottom:12px;">📡</div><p>点击左侧设备查看详情</p></div>
    <div class="detail-content" id="detailContent">
      <h3 id="detailTitle"></h3>
      <div class="info-grid" id="infoGrid"></div>
      <div id="alarmSection"></div>
    </div>

    <!-- Agent 按钮 -->
    <div class="agent-bar">
      <h4>🤖 Agent 分析（点击设备后可用）</h4>
      <button class="agent-btn btn-single" id="btnSingle" disabled onclick="runSingleAgent()">
        <span>🔍 单 Agent 分析</span>
        <span class="exp-tag">sample-6 ReAct</span>
      </button>
      <button class="agent-btn btn-multi" id="btnMulti" disabled onclick="alert('sample-12 Supervisor 待接入')">
        <span>🔀 多 Agent 排查</span>
        <span class="exp-tag">sample-12 Supervisor</span>
      </button>
      <button class="agent-btn btn-hitl" id="btnHitl" disabled onclick="alert('sample-8 HITL 待接入')">
        <span>⏸️ HITL 审批</span>
        <span class="exp-tag">sample-8 HITL</span>
      </button>
      <button class="agent-btn btn-rag" id="btnRag" disabled onclick="alert('sample-14 RAG 待接入')">
        <span>📚 知识库检索</span>
        <span class="exp-tag">sample-14 RAG</span>
      </button>
    </div>
    <div class="output-box">
      <h4>📋 Agent 输出 <span id="streamTag" style="color:#2563eb;font-weight:400;">（sample-9 Stream）</span></h4>
      <div class="output-area" id="outputArea">点击 Agent 按钮开始分析…</div>
    </div>
  </div>
</div>

<script>
let allDevices=[], selectedId=null;

fetch('/api/devices').then(r=>r.json()).then(data=>{allDevices=data.devices||[];renderTable();});

function renderTable(){
  const s=document.getElementById('searchInput').value.toLowerCase();
  const st=document.getElementById('filterStatus').value;
  const v=document.getElementById('filterVendor').value;
  let f=allDevices;
  if(st) f=f.filter(d=>d.status===st);
  if(v) f=f.filter(d=>d.vendor===v);
  if(s) f=f.filter(d=>d.device_id.toLowerCase().includes(s)||(d.model||'').toLowerCase().includes(s));
  document.getElementById('statTotal').textContent=allDevices.length;
  document.getElementById('statRunning').textContent=allDevices.filter(d=>d.status==='running').length;
  document.getElementById('statAlarm').textContent=allDevices.filter(d=>d.status==='alarm').length;
  document.getElementById('statMaintenance').textContent=allDevices.filter(d=>d.status==='maintenance').length;
  document.getElementById('tableBody').innerHTML=f.map(d=>{
    const cls='status-'+d.status, ac=selectedId===d.device_id?' active':'';
    const acnt=d.alarms?d.alarms.length:0;
    return `<tr class="${ac}" onclick="selectDevice('${d.device_id}')">
      <td><strong>${d.device_id}</strong></td><td>${d.model||'-'}</td><td>${d.vendor}</td>
      <td>${d.site}</td><td><span class="status ${cls}">${sl(d.status)}</span></td>
      <td>${acnt>0?`<span style="color:#dc2626;font-weight:700">${acnt}</span>`:'0'}</td></tr>`;
  }).join('');
}
function sl(s){return s==='running'?'运行中':s==='alarm'?'告警中':'维护中';}

function selectDevice(id){
  selectedId=id;renderTable();
  document.getElementById('btnSingle').disabled=false;
  document.getElementById('btnMulti').disabled=false;
  document.getElementById('btnHitl').disabled=false;
  document.getElementById('btnRag').disabled=false;
  fetch('/api/devices/'+id).then(r=>r.json()).then(data=>{
    if(!data.found)return;
    const d=data.device;
    document.getElementById('detailEmpty').style.display='none';
    document.getElementById('detailContent').style.display='block';
    document.getElementById('detailTitle').textContent=d.device_id+' · '+d.model;
    document.getElementById('infoGrid').innerHTML=[
      ['型号',d.model],['厂商',d.vendor],['站点',d.site],['类型',d.type],['IP',d.ip],['上线日期',d.online_date],['状态',sl(d.status)]
    ].map(([k,v])=>`<div class="info-item"><span class="label">${k}</span><span class="value">${v}</span></div>`).join('');
    const alarms=d.alarms||[];
    document.getElementById('alarmSection').innerHTML=alarms.length===0
      ?'<div class="alarm-box no-alarms">✅ 当前无告警</div>'
      :'<div class="alarm-box has-alarms"><strong>告警（'+alarms.length+'条）</strong></div>'+alarms.map(a=>`<div class="alarm-row"><span style="font-weight:700;color:#dc2626;">${a.severity}</span><span>${a.type}</span><span style="margin-left:auto;color:#9ca3af;">${a.description||''}</span></div>`).join('');
  });
}

async function runSingleAgent(){
  const out=document.getElementById('outputArea');
  out.innerHTML='<span class="loading">⏳ Agent 分析中...</span>';
  const resp=await fetch('/agent/single',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:`查 ${selectedId} 的状态和告警`,thread_id:'web-'+Date.now()})});
  out.textContent='';
  const reader=resp.body.getReader(),decoder=new TextDecoder();
  while(true){
    const{done,value}=await reader.read();
    if(done)break;
    for(const line of decoder.decode(value).split('\n')){
      if(!line.startsWith('data: '))continue;
      const p=line.slice(6);
      if(p==='[DONE]')return;
      try{out.textContent+=JSON.parse(p).content}catch(e){}
    }
  }
}
</script>
</body>
</html>
