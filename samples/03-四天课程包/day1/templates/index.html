<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Day1 Agent 平台 — 对象列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2f3542; }
  .header { background: #2f3542; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; }
  .header .sub { color: #a4b0be; font-size: 13px; }
  .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 220px; padding: 9px 14px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 14px; }
  .toolbar button { padding: 9px 18px; border: 1px solid #dcdde1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
  .toolbar button.active { background: #2f3542; color: #fff; border-color: #2f3542; }
  .stats { color: #747d8c; font-size: 13px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th { text-align: left; padding: 12px 16px; background: #f1f2f6; font-size: 13px; color: #57606f; }
  td { padding: 12px 16px; border-top: 1px solid #f1f2f6; font-size: 14px; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f8f9fd; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
  .badge.normal  { background: #e8f8ef; color: #2ed573; }
  .badge.warning { background: #fff4e0; color: #ffa502; }
  .badge.fault   { background: #ffecec; color: #ff4757; }
  .events-count { color: #ff6b81; font-weight: 600; }
</style>
</head>
<body>
  <div class="header">
    <h1>🛰️ Day1 Agent 平台</h1>
    <span class="sub">对象列表 → 点击进入详情，触发 Agent 分析（换场景 = 换 data/objects.json）</span>
  </div>

  <div class="container">
    <div class="toolbar">
      <input id="search" placeholder="搜索 ID / 名称 / 类别，回车确认" onkeydown="if(event.key==='Enter')load()">
      <button class="active" data-status="" onclick="setStatus(this)">全部</button>
      <button data-status="normal" onclick="setStatus(this)">正常</button>
      <button data-status="warning" onclick="setStatus(this)">告警</button>
      <button data-status="fault" onclick="setStatus(this)">故障</button>
    </div>
    <div class="stats" id="stats">加载中…</div>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>类别</th><th>厂商/型号</th><th>状态</th><th>异常事件</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<script>
let currentStatus = "";

function setStatus(btn) {
  document.querySelectorAll(".toolbar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentStatus = btn.dataset.status;
  load();
}

async function load() {
  const search = document.getElementById("search").value.trim();
  const params = new URLSearchParams();
  if (currentStatus) params.set("status", currentStatus);
  if (search) params.set("search", search);
  const resp = await fetch("/api/objects?" + params);
  const data = await resp.json();
  document.getElementById("stats").textContent = `共 ${data.total} 条`;
  const statusText = { normal: "正常", warning: "告警", fault: "故障" };
  document.getElementById("tbody").innerHTML = data.objects.map(o => `
    <tr class="row" onclick="location.href='/object/${o.id}'">
      <td><b>${o.id}</b></td>
      <td>${o.name}</td>
      <td>${o.category || "-"}</td>
      <td>${o.vendor || "-"} ${o.model || ""}</td>
      <td><span class="badge ${o.status}">${statusText[o.status] || o.status}</span></td>
      <td>${o.events.length ? `<span class="events-count">${o.events.length} 条</span>` : "—"}</td>
    </tr>`).join("");
}

load();
</script>
</body>
</html>
