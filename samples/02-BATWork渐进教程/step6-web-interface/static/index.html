<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAT Work Agent</title>
<style>
/* ═══════════════════════════════════════════════
   BAT Work 暗色主题
   ═══════════════════════════════════════════════ */
:root {
  --bg-primary: #0d0d1a;
  --bg-secondary: #151528;
  --bg-tertiary: #1c1c35;
  --bg-card: #222240;
  --bg-hover: #2a2a48;
  --border: #333358;
  --border-light: #3d3d60;
  --accent: #7c5cfc;
  --accent-glow: rgba(124, 92, 252, 0.25);
  --accent-dim: rgba(124, 92, 252, 0.12);
  --blue: #4dabf7;
  --green: #51cf66;
  --orange: #ffa94d;
  --red: #ff6b6b;
  --text-primary: #e4e4ed;
  --text-secondary: #9898b0;
  --text-muted: #6a6a80;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── 顶部标题栏 ── */
.header {
  height: 48px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 10px;
  flex-shrink: 0;
  -webkit-app-region: drag;
}
.header .logo {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.header .title {
  font-size: 14px; font-weight: 600; letter-spacing: -.01em;
}
.header .model-badge {
  font-size: 11px; color: var(--text-muted);
  background: var(--bg-tertiary); padding: 3px 10px; border-radius: 20px;
  margin-left: auto;
  -webkit-app-region: no-drag;
}

/* ── 主布局 ── */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 左侧边栏：文件浏览器 ── */
.sidebar-left {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.sidebar-left .section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: .06em;
  padding: 16px 16px 8px;
}
.sidebar-left .file-list {
  flex: 1; overflow-y: auto; padding: 0 8px;
}
.file-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-secondary);
  cursor: default; transition: background .15s;
}
.file-item:hover { background: var(--bg-hover); }
.file-item .icon { font-size: 14px; width: 18px; text-align: center; }
.file-item .size { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.file-item.empty { color: var(--text-muted); font-style: italic; cursor: default; }

/* ── 中间：对话区 ── */
.chat-area {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex; flex-direction: column;
  gap: 16px;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 欢迎提示 */
.welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px;
  color: var(--text-muted);
}
.welcome .big-icon { font-size: 48px; opacity: .5; }
.welcome h2 { font-size: 18px; font-weight: 500; color: var(--text-secondary); }
.welcome .hints { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.welcome .hint {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 20px; font-size: 12px;
  cursor: pointer; transition: all .15s; color: var(--text-secondary);
}
.welcome .hint:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* 消息气泡 */
.message { display: flex; gap: 10px; max-width: 85%; animation: fadeIn .25s ease; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.agent { align-self: flex-start; }
.message .avatar {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.message.user .avatar { background: var(--accent); }
.message.agent .avatar { background: var(--bg-card); border: 1px solid var(--border); }
.message .bubble {
  padding: 10px 16px; border-radius: var(--radius);
  font-size: 13.5px; line-height: 1.6;
  word-break: break-word;
}
.message.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
.message.agent .bubble { background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
.message .bubble pre { background: var(--bg-primary); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
.message .bubble code { font-size: 12px; background: rgba(124,92,252,.15); padding: 1px 5px; border-radius: 3px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* 输入区 */
.input-bar {
  padding: 14px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center;
}
.input-bar input {
  flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border);
  border-radius: 24px; padding: 10px 18px; font-size: 13.5px;
  color: var(--text-primary); outline: none;
  transition: border-color .2s;
}
.input-bar input:focus { border-color: var(--accent); }
.input-bar input::placeholder { color: var(--text-muted); }
.input-bar button {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.input-bar button:hover { background: #9370ff; transform: scale(1.05); }
.input-bar button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.input-bar button.loading { background: var(--border); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* ── 右侧面板：执行追踪 ── */
.sidebar-right {
  width: 280px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.sidebar-right .section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: .06em;
  padding: 16px 16px 10px;
}
.trace-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
.trace-item {
  padding: 10px 12px; border-radius: var(--radius-sm);
  margin-bottom: 6px; font-size: 12.5px;
  border: 1px solid transparent;
  transition: all .2s;
}
.trace-item .step-header {
  display: flex; align-items: center; gap: 8px;
  font-weight: 500; margin-bottom: 4px;
}
.trace-item .step-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.trace-item.pending { opacity: .4; background: transparent; }
.trace-item.pending .step-dot { background: var(--text-muted); }
.trace-item.running { background: var(--accent-dim); border-color: var(--accent); }
.trace-item.running .step-dot { background: var(--accent); animation: pulse 1s infinite; }
.trace-item.done { background: transparent; border-color: var(--border-light); }
.trace-item.done .step-dot { background: var(--green); }
.trace-item .step-output {
  color: var(--text-muted); font-size: 11.5px;
  margin-top: 6px; max-height: 120px; overflow-y: auto;
  word-break: break-word; line-height: 1.5;
  display: none;
}
.trace-item.done .step-output, .trace-item.running .step-output { display: block; }
.trace-item.error .step-dot { background: var(--red); }
.trace-item.error { background: rgba(255,107,107,.08); border-color: rgba(255,107,107,.3); }

/* 响应式：小屏幕隐藏侧边栏 */
@media (max-width: 900px) {
  .sidebar-left, .sidebar-right { display: none; }
}
</style>
</head>
<body>

<!-- ── 顶部标题栏 ── -->
<div class="header">
  <div class="logo">🤖</div>
  <span class="title">BAT Work Agent</span>
  <span class="model-badge" id="modelBadge">--</span>
</div>

<!-- ── 主布局 ── -->
<div class="main-layout">

  <!-- 左侧：文件浏览器 -->
  <aside class="sidebar-left">
    <div class="section-title">📂 工作区文件</div>
    <div class="file-list" id="fileList">
      <div class="file-item empty">加载中…</div>
    </div>
  </aside>

  <!-- 中间：对话区 -->
  <main class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcome">
        <div class="big-icon">🤖</div>
        <h2>BAT Work Agent</h2>
        <p style="color:var(--text-muted);font-size:13px">基于 LangGraph 的 AI 任务助手</p>
        <div class="hints">
          <span class="hint" onclick="sendHint(this.textContent)">列出当前目录的文件</span>
          <span class="hint" onclick="sendHint(this.textContent)">分析 sales.csv 的销售数据</span>
          <span class="hint" onclick="sendHint(this.textContent)">帮我生成一份数据分析报告</span>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="输入你的任务…" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>

  <!-- 右侧：执行追踪 -->
  <aside class="sidebar-right">
    <div class="section-title">🔍 Agent 执行追踪</div>
    <div class="trace-list" id="traceList">
      <div class="trace-item pending" data-node="understand_intent">
        <div class="step-header"><span class="step-dot"></span> 意图理解</div>
      </div>
      <div class="trace-item pending" data-node="enrich_context">
        <div class="step-header"><span class="step-dot"></span> 上下文补齐</div>
      </div>
      <div class="trace-item pending" data-node="plan_tasks">
        <div class="step-header"><span class="step-dot"></span> 任务规划</div>
      </div>
      <div class="trace-item pending" data-node="execute_tool">
        <div class="step-header"><span class="step-dot"></span> 工具执行</div>
      </div>
      <div class="trace-item pending" data-node="validate_result">
        <div class="step-header"><span class="step-dot"></span> 结果校验</div>
      </div>
      <div class="trace-item pending" data-node="generate_output">
        <div class="step-header"><span class="step-dot"></span> 产物生成</div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════════════════
   WebSocket 通信 + UI 渲染
   ═══════════════════════════════════════════════ */

const NODE_LABELS = {
  understand_intent: '意图理解',
  enrich_context: '上下文补齐',
  plan_tasks: '任务规划',
  execute_tool: '工具执行',
  validate_result: '结果校验',
  generate_output: '产物生成',
  handle_error: '兜底处理'
};

let ws = null;
let isProcessing = false;

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => console.log('✅ WebSocket 已连接');
  ws.onclose = () => { console.log('🔌 WebSocket 断开，5s 后重连…'); setTimeout(connect, 5000); };
  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    handleMessage(msg);
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'start':
      onAgentStart(msg.query);
      break;
    case 'node_update':
      onNodeUpdate(msg.node, msg.data);
      break;
    case 'done':
      onAgentDone();
      break;
    case 'error':
      onAgentError(msg.message);
      break;
  }
}

/* ── Agent 开始 ── */
function onAgentStart(query) {
  isProcessing = true;
  document.getElementById('welcome')?.remove();

  // 添加用户消息
  addMessage('user', query);

  // 重置追踪面板
  document.querySelectorAll('.trace-item').forEach(el => {
    el.className = 'trace-item pending';
    el.querySelector('.step-output')?.remove();
  });

  // 发送按钮变 loading
  const btn = document.getElementById('sendBtn');
  btn.classList.add('loading');
  btn.disabled = true;
}

/* ── 节点更新 ── */
function onNodeUpdate(nodeName, data) {
  const el = document.querySelector(`.trace-item[data-node="${nodeName}"]`);
  if (!el) return;

  // 标记所有之前的节点为 done
  let found = false;
  document.querySelectorAll('.trace-item').forEach(item => {
    if (item.dataset.node === nodeName) found = true;
    if (!found) item.className = 'trace-item done';
    else if (item.dataset.node === nodeName) item.className = 'trace-item running';
  });

  // 更新输出内容
  let existing = el.querySelector('.step-output');
  if (!existing) {
    existing = document.createElement('div');
    existing.className = 'step-output';
    el.appendChild(existing);
  }

  // 提取关键信息展示
  const preview = formatNodeData(nodeName, data);
  existing.textContent = preview;

  // 特殊处理：产物生成时显示最终结果
  if (nodeName === 'generate_output' && data.final_output) {
    addMessage('agent', data.final_output);
  }

  // 滚动追踪面板
  existing.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── Agent 完成 ── */
function onAgentDone() {
  isProcessing = false;
  const btn = document.getElementById('sendBtn');
  btn.classList.remove('loading');
  btn.disabled = false;

  // 所有节点标记完成
  document.querySelectorAll('.trace-item').forEach(el => {
    el.className = 'trace-item done';
  });

  // 刷新文件列表
  loadFiles();
}

/* ── Agent 错误 ── */
function onAgentError(message) {
  isProcessing = false;
  const btn = document.getElementById('sendBtn');
  btn.classList.remove('loading');
  btn.disabled = false;
  addMessage('agent', `❌ 执行出错: ${message}`);
}

/* ── 添加消息 ── */
function addMessage(role, content) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // 简单的 Markdown 渲染（代码块 + 加粗 + 列表）
  let html = escapeHtml(content)
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)/gm, '<h4 style="margin:8px 0 4px">$1</h4>')
    .replace(/^## (.+)/gm, '<h3 style="margin:10px 0 4px;font-size:15px">$1</h3>')
    .replace(/^- (.+)/gm, '<li style="margin-left:16px">$1</li>')
    .replace(/\n/g, '<br>');

  bubble.innerHTML = html;
  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  return text.replace(/[&<>"]/g, c => map[c] || c);
}

/* ── 发送消息 ── */
function sendMessage() {
  if (isProcessing) return;
  const input = document.getElementById('msgInput');
  const query = input.value.trim();
  if (!query) return;

  ws.send(JSON.stringify({ query }));
  input.value = '';
}

function sendHint(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

/* ── 节点数据格式化 ── */
function formatNodeData(nodeName, data) {
  switch (nodeName) {
    case 'understand_intent':
      return data.intent || '';
    case 'enrich_context':
      return data.enriched_context?.split('\n').slice(0, 5).join('\n') || '';
    case 'plan_tasks': {
      const plan = data.plan || [];
      if (plan.length === 0) return '无需工具，直接生成回复';
      return plan.map(p => `Step ${p.step}: ${p.action}(${p.target})`).join('\n');
    }
    case 'execute_tool': {
      const results = data.tool_results || [];
      if (results.length === 0) return '';
      const last = results[results.length - 1];
      return `${last.success ? '✅' : '❌'} ${last.action}: ${(last.output || '').slice(0, 200)}`;
    }
    case 'validate_result':
      return data.validation_passed ? '✅ 校验通过' : `❌ ${data.validation_feedback || '校验失败'}`;
    case 'generate_output':
      return (data.final_output || '').slice(0, 300) + '…';
    case 'handle_error':
      return '⚠️ 进入兜底处理…';
    default:
      return JSON.stringify(data).slice(0, 300);
  }
}

/* ── 加载文件列表 ── */
async function loadFiles() {
  try {
    const resp = await fetch('/api/files');
    const data = await resp.json();
    const container = document.getElementById('fileList');
    if (data.files.length === 0) {
      container.innerHTML = '<div class="file-item empty">(空目录)</div>';
    } else {
      container.innerHTML = data.files.map(f => {
        const icon = f.name.endsWith('.csv') ? '📊' :
                     f.name.endsWith('.md') ? '📝' :
                     f.name.endsWith('.py') ? '🐍' :
                     f.name.endsWith('.json') ? '📋' : '📄';
        const size = f.size > 1024 ? `${(f.size/1024).toFixed(0)}KB` : `${f.size}B`;
        return `<div class="file-item"><span class="icon">${icon}</span>${f.name}<span class="size">${size}</span></div>`;
      }).join('');
    }
  } catch (e) {
    // ignore
  }
}

/* ── 初始化 ── */
connect();
loadFiles();

// 尝试从 URL 获取模型信息
fetch('/api/files').then(r => r.json()).then(() => {
  // 只是个 ping，model badge 在 server 启动后通过其他方式显示
}).catch(() => {});
</script>

</body>
</html>
